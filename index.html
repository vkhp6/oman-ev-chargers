<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة الشواحن السريعة - عُمان</title>
    
    <!-- استدعاء مكتبة الخرائط Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }

        /* شاشة الترحيب الاحترافية مع تأثير التغبيش (Blur) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            padding: 20px;
            box-sizing: border-box;
        }

        /* محتوى شاشة الترحيب */
        .splash-content {
            text-align: center;
            max-width: 450px;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #00e5ff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
        }

        .splash-icon {
            font-size: 40px;
            background: #121212;
            border: 3px solid #ffaa00;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }

        .splash-content h1 {
            font-size: 24px;
            color: #00e5ff;
            margin: 0 0 15px 0;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        /* تنسيق الملاحظة التنبيهية */
        .splash-notice {
            font-size: 13px;
            color: #dcdcdc;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: right;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 10px;
            border-right: 4px solid #ffaa00;
        }

        /* زر تخطي الملاحظة (تمام !) */
        .splash-btn {
            background-color: #00e5ff;
            color: #121212;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            width: 100%;
        }

        .splash-btn:hover {
            background-color: #ffaa00;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
        }

        /* زر العودة للموقع الحالي */
        .locate-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(18, 18, 18, 0.9);
            border: 2px solid #00e5ff;
            color: #00e5ff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            transition: 0.3s;
        }

        .locate-btn:hover {
            background: #00e5ff;
            color: #121212;
            transform: scale(1.1);
        }

        /* تصميم نافذة التفاصيل */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: rgba(30, 30, 30, 0.95) !important;
            color: #fff !important;
            border: 1px solid #333;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        /* تصميم النقطة الاحترافية لموقع المستخدم */
        .user-pulse-container {
            position: relative;
            width: 30px;
            height: 30px;
        }

        .user-dot {
            width: 14px;
            height: 14px;
            background-color: #00e5ff;
            border: 3px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            left: 8px;
            box-shadow: 0 0 10px #00e5ff;
            z-index: 2;
        }

        .user-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 30px;
            height: 30px;
            border: 3px solid #00e5ff;
            border-radius: 50%;
            animation: radar-pulse 2s infinite ease-out;
            opacity: 0.8;
            z-index: 1;
        }

        @keyframes radar-pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- شاشة الترحيب المغبشة مع الملاحظة وزر التخطي -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-icon">⚡</div>
            <h1>الشواحن السريعة في عُمان</h1>
            <div class="splash-notice">
                ⚠️ <strong>ملاحظة هامة:</strong><br>
                • الموقع لا زال قيد الإنشاء ولم تضف جميع المحطات بعد.<br>
                • تفاصيل محطات الشحن هي حسب ما هو معلن.<br>
                • ربما تصل إلى المحطة وتجدها لا تعمل لأسباب صيانة أو عطل مفاجئ.<br>
                • هذا الموقع وُجد لمساعدتك على معرفة مواقع الشواحن فقط لا غير.
            </div>
            <button class="splash-btn" onclick="closeSplash()">تمام !</button>
        </div>
    </div>

    <!-- زر لتوجيه الكاميرا لموقعك بضغطة واحدة -->
    <div class="locate-btn" onclick="panToUser()" title="موقعي">
        📍
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // دالة إغلاق شاشة الترحيب عند الضغط على "تمام !"
        function closeSplash() {
            var splash = document.getElementById('splash-screen');
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
        }

        var map = L.map('map', {
            zoomControl: false 
        }).setView([21.4735, 55.9754], 6);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 18
        }).addTo(map);

        var userLocation = null;
        var userMarker = null;

        var userIcon = L.divIcon({
            html: '<div class="user-pulse-container"><div class="user-ring"></div><div class="user-dot"></div></div>',
            className: '',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });

        function panToUser() {
            if (userLocation) {
                map.flyTo(userLocation, 14, { animate: true, duration: 1.5 });
            } else {
                alert("جاري تحديد موقعك، يرجى الانتظار أو السماح للمتصفح بالوصول للموقع.");
            }
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                userLocation = L.latLng(lat, lng);

                userMarker = L.marker(userLocation, {icon: userIcon}).addTo(map)
                    .bindPopup('<div dir="rtl" style="text-align:center; color:#00e5ff; font-weight:bold;">📍 أنت هنا</div>');

                map.flyTo(userLocation, 13, { animate: true, duration: 2 });

            }, function(error) {
                console.log("تم رفض إذن تحديد الموقع أو حدث خطأ.");
            }, { enableHighAccuracy: true });
        }

        var fastChargerIcon = L.divIcon({
            html: '<div style="font-size: 20px; background: #121212; border: 2px solid #ffaa00; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px #ffaa00;">⚡</div>',
            className: '',
            iconSize: [30, 30],
            iconAnchor: [15, 30],
            popupAnchor: [0, -30] 
        });

        function addCharger(name, lat, lng, power, plugType, description, gmapsLink) {
            var marker = L.marker([lat, lng], {icon: fastChargerIcon}).addTo(map);
            
            marker.on('click', function() {
                var distanceText = '<div style="color: #ff5555; font-size: 13px; margin-bottom: 10px;">📍 يرجى تفعيل الموقع لمعرفة المسافة</div>';
                
                if (userLocation) {
                    var distanceInMeters = userLocation.distanceTo([lat, lng]);
                    var distanceInKm = (distanceInMeters / 1000).toFixed(1); 
                    distanceText = `<div style="color: #00e5ff; font-size: 14px; margin-bottom: 10px; font-weight: bold;">📍 يبعد عنك: ${distanceInKm} كم</div>`;
                }

                var popupContent = `
                    <div dir="rtl" style="text-align: right; min-width: 230px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                        <div style="font-size: 18px; font-weight: bold; color: #00e5ff; margin-bottom: 5px;">${name}</div>
                        
                        ${distanceText}
                        
                        <div style="font-size: 13px; color: #dcdcdc; margin-bottom: 12px; line-height: 1.6;">
                            ${description}
                        </div>

                        <div style="margin-bottom: 15px; font-size: 14px;"><strong>المنفذ:</strong> ${plugType}</div>
                        
                        <div style="display: inline-block; background: #ffaa00; color: #000; padding: 5px 12px; border-radius: 10px; font-weight: bold; margin-bottom: 15px;">
                            ⚡ ${power} kW
                        </div>
                        
                        <a href="${gmapsLink}" target="_blank" style="display: block; width: 90%; margin: 0 auto; padding: 10px; background-color: #00e5ff; color: #000; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s;">
                            🚗 انطلق الآن
                        </a>
                    </div>
                `;
                marker.bindPopup(popupContent).openPopup();
            });
        }

        // ==========================================
        // منطقة إضافة المحطات
        // ==========================================

        // 1. محطة EVO (نفط عُمان)
        addCharger(
            "محطة EVO (نفط عُمان)", 
            23.622844, 58.507355, 
            180, 
            "CCS2 (منفذين)", 
            "وجهة شحن متكاملة تضمن لك راحة تامة أثناء انتظارك (تتضمن <strong>منفذين للشحن السريع</strong>). استمتع بقهوتك المفضلة من <strong>55 Coffee</strong> أو تذوق كوباً من <strong>تشاي</strong> المميز. تتوفر بالمحطة دورات مياه نظيفة لخدمتك، كما يقع المسجد على بُعد دقيقتين فقط بالسيارة.",
            "https://maps.app.goo.gl/qRjrsLPuc35uNHUy9"
        );

        // 2. محطة Shell الأولى
        addCharger(
            "محطة Shell", 
            23.584534, 58.198266, 
            50, 
            "CCS2 (منفذ واحد)", 
            "محطة متكاملة ومريحة تلبي احتياجاتك أثناء الشحن (تتضمن <strong>منفذاً واحداً للشحن</strong>). تتضمن <strong>مقهى</strong> مميزاً، <strong>سوبرماركت</strong> لتسوق احتياجاتك، بالإضافة إلى توفر <strong>مصلى</strong> ودورات مياه نظيفة.",
            "https://maps.app.goo.gl/qRjrsLPuc35uNHUy9"
        );

        // 3. محطة Shell الفائقة الجديدة
        addCharger(
            "محطة Shell الفائقة", 
            23.632180, 58.054017, 
            200, 
            "CCS2 (منفذين)", 
            "محطة شحن فائقة السرعة تمنحك طاقة قصيرة ومريحة (تتضمن <strong>منفذين للشحن</strong>). يتوفر في الموقع <strong>كوفي</strong> أنيق، <strong>مطعم</strong> وجبات، و<strong>سوبرماركت</strong> متكامل لتلبية كافة احتياجاتك.",
            "https://maps.app.goo.gl/qRjrsLPuc35uNHUy9"
        );

        // 4. محطة Shell 
        addCharger(
            "محطة Shell", 
            23.711551, 57.241478, 
            180, 
            "CCS2 (منفذين)", 
            "محطة شحن سريعة متكاملة (تتضمن <strong>منفذين للشحن</strong>). يتوفر في الموقع <strong>مصلى</strong>، <strong>مقهى</strong>، و<strong>سوبرماركت</strong> لتلبية كافة احتياجاتك أثناء الانتظار.",
            "https://maps.app.goo.gl/qRjrsLPuc35uNHUy9"
        );

        // 5. محطة Shell 
        addCharger(
            "محطة Shell", 
            23.709153, 57.239824, 
            180, 
            "CCS2 (منفذين)", 
            "محطة شحن سريعة متكاملة (تتضمن <strong>منفذين للشحن</strong>). يتوفر في الموقع <strong>مصلى</strong>، <strong>مقهى</strong>، و<strong>سوبرماركت</strong> لتلبية كافة احتياجاتك أثناء الانتظار.",
            "https://maps.app.goo.gl/qRjrsLPuc35uNHUy9"
        );

        // 6. محطة EVO الجديدة
        addCharger(
            "محطة EVO", 
            24.414492, 56.599671, 
            120, 
            "CCS2 (منفذين)", 
            "محطة شحن سريعة (تتضمن <strong>منفذين للشحن</strong>). يتوفر في الموقع <strong>مقهى</strong> و<strong>سوبرماركت</strong> لخدمتك.",
            "https://maps.app.goo.gl/qRjrsLPuc35uNHUy9"
        );

        // 7. محطة Shell الجديدة
        addCharger(
            "محطة Shell", 
            24.501530, 56.504854, 
            180, 
            "CCS2 (منفذين)", 
            "محطة شحن سريعة (تتضمن <strong>منفذين للشحن</strong>). يتوفر في الموقع <strong>سوبرماركت</strong>، <strong>مصلى</strong>، و<strong>دورات مياه</strong>.",
            "https://maps.app.goo.gl/qRjrsLPuc35uNHUy9"
        );

        // 8. محطة نماء للكهرباء (الأولى)
        addCharger(
            "محطة نماء للكهرباء", 
            24.344938, 56.729517, 
            180, 
            "CCS2 (منفذين)", 
            "محطة شحن سريعة تابعة لنماء للكهرباء (تتضمن <strong>منفذين للشحن</strong>).",
            "https://maps.app.goo.gl/qRjrsLPuc35uNHUy9"
        );

        // 9. محطة نماء للكهرباء (الثانية)
        addCharger(
            "محطة نماء للكهرباء", 
            23.584899, 58.324200, 
            180, 
            "CCS2 (منفذين)", 
            "محطة شحن سريعة تابعة لنماء للكهرباء (تتضمن <strong>منفذين للشحن</strong>).",
            "https://maps.app.goo.gl/qRjrsLPuc35uNHUy9"
        );

    </script>
</body>
</html>
